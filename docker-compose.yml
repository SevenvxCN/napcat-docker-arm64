services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    # 归档镜像是 linux/arm64（Apple Silicon / arm64 Linux 原生跑）
    platform: linux/arm64
    container_name: napcat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # OneBot v11 HTTP
      - "127.0.0.1:3001:3001"   # OneBot v11 WebSocket
      - "127.0.0.1:6099:6099"   # NapCat WebUI
    environment:
      ACCOUNT: "${NAPCAT_ACCOUNT}"   # 换成对方的 QQ 号
      NAPCAT_UID: "501"
      NAPCAT_GID: "20"
      TZ: "Asia/Shanghai"
    volumes:
      - "./qq:/app/.config/QQ"
      - "./config:/app/napcat/config"
